paths:
  raw_dir: "data/raw"
  bronze_dir: "data/bronze"
  silver_dir: "data/silver"
  gold_dir: "data/gold"
  results_dir: "results"
  kml_path: "data/raw/limites_rejeitos_dia29_v2.kml"

red_threshold:
  r_min: 150
  g_max: 80
  b_max: 80

# Approximate KML bounding box for Brumadinho dam collapse impact zone
kml_bbox:
  lon_min: -44.175
  lon_max: -44.095
  lat_min: -20.195
  lat_max: -20.140

# Minimum confidence threshold for MS Building Footprints
footprint_min_confidence: 0.90

# YOLO-based inference pipeline
yolo_model_path: "data/raw/geo_builds.pt"
yolo_confidence_threshold: 0.25
